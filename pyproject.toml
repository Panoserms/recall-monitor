[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-monitor"
version = "1.0.0"
description = "Turns official German food recall notices into structured records and alerts you when a recalled product matches your own product list. Rules first, LLM last."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "spacy>=3.7,<4",
  "rapidfuzz>=3.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
recall = "recall.cli:app"

[tool.setuptools.packages.find]
include = ["recall*"]

[tool.setuptools.package-data]
recall = ["lexicons/*.tsv", "web/templates/*.html", "web/static/*", "web/static/fonts/*", "site/templates/*.html", "site/static/*", "site/static/vendor/*/*", "site/static/vendor/*/*/*", "site/static/media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"
