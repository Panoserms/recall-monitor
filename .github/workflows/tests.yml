name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m spacy download de_core_news_sm
      # Tests that need raw notices are skipped here: raw notices are not in the repository.
      - run: python -m pytest
